; RADV (Mesa's AMD Vulkan driver) segfaults inside vkCreateComputePipelines when Unreal precaches the global compute
; shaders at startup, on GCN cards at least (Radeon R5 M445 / ICELAND on the test laptop). The game itself creates
; its compute pipelines fine, so the crash is in that startup precache batch: skip it on Linux and let those PSOs be
; created when they are first used.
;
; The Linux shader format is set in Config/DefaultEngine.ini instead, because the cook runs on Windows and only reads
; the project-wide config chain there.
[ConsoleVariables]
r.PSOPrecache.GlobalShaders=0
