; RADV (Mesa's AMD Vulkan driver) segfaults inside vkCreateComputePipelines while Unreal precaches the global compute
; shaders at startup, on GCN cards at least (Radeon R5 M445 / ICELAND). Precache stays on for Linux in general; the
; staged launch script (see build.bat) turns it off only when the machine's Vulkan driver is RADV, so affected
; machines do not need a manual flag.
;
; The Linux shader format is set in Config/DefaultEngine.ini instead, because the cook runs on Windows and only reads
; the project-wide config chain there.
