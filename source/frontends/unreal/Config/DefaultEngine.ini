[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Engine/Maps/Entry
EditorStartupMap=/Engine/Maps/Entry
GlobalDefaultGameMode=/Script/Balls.BallsGameMode

[/Script/Engine.RendererSettings]
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.Bloom=True
r.AntiAliasingMethod=2
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=0
r.Shadow.Virtual.Enable=0
; Read once at startup, so they are on in every build and the Graphics page switches the features themselves
; (r.Nanite, r.DynamicGlobalIlluminationMethod, r.Shadow.Virtual.Enable) at run time. Lumen's software tracing reads
; the meshes' distance fields.
r.Nanite.ProjectEnabled=True
r.GenerateMeshDistanceFields=True

; Slate units are window pixels, as in the SDL front end, which draws the same sizes at any window size; the engine's
; default curve would shrink the whole UI to 0.83 at a 900-pixel-high window.
[/Script/Engine.UserInterfaceSettings]
UIScaleRule=ShortestSide
UIScaleCurve=(EditorCurveData=(Keys=((Time=480,Value=1.0),(Time=8640,Value=1.0))),ExternalCurve=None)

[/Script/AndroidRuntimeSettings.AndroidRuntimeSettings]
PackageName=com.colorblastballs.game
MinSDKVersion=26
TargetSDKVersion=35
Orientation=Portrait
bFullScreen=True
; Report the display cutout as a safe-area inset so the HUD (BallsLayout.cpp) can stay out of it.
bUseDisplayCutout=True
bSupportsVulkan=True
bBuildForES31=True

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
; SM6 is what Lumen, Nanite and virtual shadow maps need; D3D12 picks it on any GPU that has it. SM5 stays as the
; fallback for older GPUs, and for the engine fork, whose DXC path (SM6) miscompiles global compute shaders.
+D3D12TargetedShaderFormats=PCD3D_SM6
+D3D12TargetedShaderFormats=PCD3D_SM5

[SystemSettings]
r.VSync=0
t.MaxFPS=0
; The fork's DXC path fails a set of engine global shaders (hair, TSR, heterogeneous volumes) and the editor
; treats that as fatal. None of them are used by this game, so log the errors and keep going.
r.AreShaderErrorsFatal=0

[/Script/AndroidFileServerEditor.AndroidFileServerRuntimeSettings]
bEnablePlugin=True
bAllowNetworkConnection=True
SecurityToken=ED0C01B3405F3D9EF0176ABA17F73DBA
bIncludeInShipping=False
bAllowExternalStartInShipping=False
bCompileAFSProject=False
bUseCompression=False
bLogFiles=False
bReportStats=False
ConnectionType=USBOnly
bUseManualIPAddress=False
ManualIPAddress=


; The engine fork cooks the Linux global shaders for SM6 only, and its DXC path miscompiles them. Cooking runs on
; Windows, which reads this project-wide section (a Config/Linux/LinuxEngine.ini overlay is not loaded then), so the
; Linux shader format is set here for both the cook and the Linux game.
[/Script/LinuxTargetPlatform.LinuxTargetSettings]
-TargetedRHIs=SF_VULKAN_SM6
+TargetedRHIs=SF_VULKAN_SM5
RayTracingMode=Disabled
