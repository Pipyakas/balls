plugins {
     id 'com.android.application'
}

android {
    namespace = "com.gameloft.balls.sdl"
    compileSdkVersion 35
    defaultConfig {
        applicationId "com.gameloft.balls.sdl"
        minSdkVersion 26
        ndkVersion "27.2.12479018"
        targetSdkVersion 35
        versionCode 1
        versionName "0.1.0"
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_PLATFORM=android-26", "-DANDROID_STL=c++_static", "-DBALLS_FRONTEND=sdl", "-DBALLS_BUILD_TOOLS=OFF", "-DBALLS_ENABLE_CUDA=OFF", "-DBALLS_RENDERER=" + (project.findProperty('ballsRenderer') ?: 'webgpu')
                abiFilters 'arm64-v8a'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    applicationVariants.all { variant ->
        tasks["merge${variant.name.capitalize()}Assets"]
            .dependsOn("externalNativeBuild${variant.name.capitalize()}")
    }
    sourceSets.main {
        assets.srcDirs = ['../../../../../data/assets']
        jniLibs.srcDirs = ['src/main/jniLibs', '../../../../../externals/wgpu-native/android']
    }
    externalNativeBuild {
        cmake {
            path '../../../../../CMakeLists.txt'

            version '3.25.0+'
        }
    }
    lint {
        abortOnError = false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
